# Supabase Free pausa o projeto depois de 7 dias sem atividade no banco (ver
# docs/handoff.md e a conversa do roteiro de lançamento). Uma leitura leve por
# dia já basta pra evitar isso, então este workflow só faz um SELECT de 1
# linha via API REST — não escreve nada, não custa nada (bem dentro da cota
# grátis de minutos do GitHub), e nem depende do site estar no ar.
name: Manter Supabase ativo

on:
  schedule:
    # Todo dia, meio-dia UTC (09h em Brasília, sem horário de verão).
    - cron: '0 12 * * *'
  # Permite rodar na mão pela aba Actions, pra testar sem esperar o cron.
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Leitura leve pro banco não pausar
        run: |
          # Limpa o que costuma vir grudado quando o secret é colado à mão:
          # espaço, quebra de linha, aspas e a barra final da URL. Um único
          # caractere sobrando no domínio já faz o curl falhar com código 6
          # ("não consegui resolver o host") — foi exatamente o erro que
          # aparecia todo dia antes desta limpeza.
          url=$(printf '%s' "$SUPABASE_URL" | tr -d " \r\n\"'")
          url=${url%/}
          chave=$(printf '%s' "$SUPABASE_ANON_KEY" | tr -d " \r\n\"'")

          # Mostra só o domínio (sem o id do projeto), pra dar pra conferir o
          # formato no log sem expor nada.
          echo "domínio: ${url##*.supabase}"

          # `|| status=000`: o shell do Actions roda com `-e`, então sem isto
          # uma falha de rede do curl matava o script antes de qualquer echo,
          # e o log ficava mudo. --retry cobre instabilidade momentânea.
          status=$(curl -s -o /dev/null -w "%{http_code}" --retry 3 --retry-delay 10 \
            --max-time 30 \
            "$url/rest/v1/obras?select=id&limit=1" \
            -H "apikey: $chave") || status=000
          echo "status da resposta: $status"
          if [ "$status" = "000" ]; then
            echo "Nem chegou no Supabase (DNS/rede). Confira se o secret NEXT_PUBLIC_SUPABASE_URL é exatamente https://<id>.supabase.co"
            exit 1
          fi
          # 2xx é sucesso; qualquer outra coisa falha o job pra virar um aviso
          # visível na aba Actions (e-mail do GitHub em caso de falha).
          if [ "${status:0:1}" != "2" ]; then
            echo "Resposta inesperada do Supabase — confira os secrets NEXT_PUBLIC_SUPABASE_URL/NEXT_PUBLIC_SUPABASE_ANON_KEY."
            exit 1
          fi
        env:
          # Mesmos nomes de secret do ci.yml — mesma chave anon, um só lugar
          # pra cadastrar (ela já é pública por natureza, vai pro bundle do
          # navegador; a segurança real é o RLS do Supabase).
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
