  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

animation: riseIn 900ms cubic-bezier(0.16,1,0.3,1) both;\">\n      <div style=\"font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: #E9C98A; font-weight: 600; margin-bottom: 20px;\">Fotografia Fine Art<\u002Fdiv>\n      <h1 style=\"font-family: 'Instrument Serif', serif; font-weight: 400; font-style: italic; font-size: 76px; line-height: 1.05; color: #F5F1EA; margin: 0 0 24px; max-width: 800px;\">A luz que permanece depois do instante.<\u002Fh1>\n      <p style=\"font-size: 17px; color: #E9E3D6; max-width: 520px; margin: 0 0 40px;\">Obras exclusivas e edições limitadas em papel algodão, fotografia fine art e metacrílico, assinadas por Bocairú.<\u002Fp>\n      <div style=\"display: flex; gap: 20px;\">\n        <a href=\"Galeria.dc.html\" style=\"text-decoration: none; background: #F5F1EA; color: #1B1814; padding: 15px 30px; font-size: 14px; letter-spacing: 0.03em; border-radius: 2px; transition: background 250ms ease, transform 150ms ease;\" style-hover=\"background:#E9C98A;\" style-active=\"transform:scale(0.98);\">Ver a galeria<\u002Fa>\n        <a href=\"A Artista.dc.html\" style=\"text-decoration: none; border: 1px solid rgba(245,241,234,0.6); color: #F5F1EA; padding: 15px 30px; font-size: 14px; letter-spacing: 0.03em; border-radius: 2px; transition: border-color 250ms ease, transform 150ms ease;\" style-hover=\"border-color:#F5F1EA;\" style-active=\"transform:scale(0.98);\">Conhecer a fotógrafa<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"position: absolute; right: 48px; bottom: 40px; display: flex; align-items: center; gap: 10px; color: #E9E3D6; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;\">\n      <div style=\"width: 1px; height: 32px; background: rgba(245,241,234,0.5);\"><\u002Fdiv>\n      Role para explorar\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 2. MANIFESTO ============ -->\n  <section style=\"max-width: 900px; margin: 0 auto; padding: 200px 96px; text-align: center;\">\n    <div style=\"font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: #A9814A; font-weight: 600; margin-bottom: 32px;\">Manifesto<\u002Fdiv>\n    <p style=\"font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400; font-size: 34px; line-height: 1.5; color: #1B1814; margin: 0 0 32px;\">\"Não fotografo o que vejo na primeira vez. Espero até que o lugar pare de posar — e a fotografia aconteça sozinha, sem pressa e sem plateia.\"<\u002Fp>\n    <div style=\"font-size: 14px; color: #6B6459; letter-spacing: 0.04em;\">— Bocairú<\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 3. COLEÇÕES ============ -->\n  <section id=\"colecoes\" style=\"background: #EDE6D8; padding: 140px 0;\">\n    <div style=\"max-width: 1440px; margin: 0 auto; padding: 0 96px; display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 56px;\">\n      <div>\n        <div style=\"font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: #A9814A; font-weight: 600; margin-bottom: 16px;\">Coleções<\u002Fdiv>\n        <h2 style=\"font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 42px; margin: 0;\">Um olhar, muitos capítulos.<\u002Fh2>\n      <\u002Fdiv>\n      <a href=\"Colecoes.dc.html\" style=\"text-decoration: underline; text-underline-offset: 4px; font-size: 14px; color: #1B1814; white-space: nowrap;\">Ver todas as coleções →<\u002Fa>\n    <\u002Fdiv>\n    <div style=\"display: flex; gap: 28px; overflow-x: auto; padding: 0 96px 12px; scroll-snap-type: x proximity;\">\n      <a href=\"Galeria.dc.html?serie=retratos\" style=\"flex: 0 0 360px; scroll-snap-align: start; text-decoration: none; color: inherit;\">\n        <div style=\"position: relative; overflow: hidden;\">\n          <image-slot id=\"series-1\" shape=\"rect\" placeholder=\"Série: Retratos\" style=\"width: 100%; aspect-ratio: 3/4; display: block; transition: transform 700ms cubic-bezier(0.16,1,0.3,1);\" style-hover=\"transform:scale(1.04)  style=\"font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: #2F5233;\">Disponível<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <a href=\"Pagina da Obra.dc.html\" style=\"text-decoration: none; color: inherit;\"><div style=\"overflow: hidden; border: 1px solid #DCD4C4;\">\n          <image-slot id=\"feat-2\" shape=\"rect\" placeholder=\"Obra em destaque 2\" style=\"width: 100%; aspect-ratio: 4/5; display: block; transition: transform 700ms cubic-bezier(0.16,1,0.3,1);\" style-hover=\"transform:scale(1.04);\"><\u002Fimage-slot>\n        <\u002Fdiv><\u002Fa>\n        <div style=\"padding-top: 18px; display: flex; justify-content: space-between; align-items: baseline;\">\n          <div>\n            <a href=\"Pagina da Obra.dc.html\" style=\"font-size: 16px; font-weight: 500; color: #1B1814; text-decoration: none;\" style-hover=\"text-decoration:underline;\">Silêncio Azul<\u002Fa>\n            <div style=\"font-size: 13px; color: #6B6459; margin-top: 4px;\">Fotografia fine art · Metacrílico<\u002Fdiv>\n          <\u002Fdiv>\n          <span style=\"font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: #7A2E32;\">Vendida<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <a href=\"Pagina da Obra.dc.html\" style=\"text-decoration: none; color: inherit;\"><div style=\"overflow: hidden; border: 1px solid #DCD4C4;\">\n          <image-slot id=\"feat-3\" shape=\"rect\" placeholder=\"Obra em destaque 3\" style=\"width: 100%; aspect-ratio: 4/5; display: block; transition: transform 700ms cubic-bezier(0.16,1,0.3,1);\" style-hover=\"transform:scale(1.04);\"><\u002Fimage-slot>\n        <\u002Fdiv><\u002Fa>\n        <div style=\"padding-top: 18px; display: flex; justify-content: space-between; align-items: baseline;\">\n          <div>\n            <a href=\"Pagina da Obra.dc.html\" style=\"font-size: 16px; font-weight: 500; color: #1B1814; text-decoration: none;\" style-hover=\"text-decoration:underline;\">Jardim Interno<\u002Fa>\n            <div style=\"font-size: 13px; color: #6B6459; margin-top: 4px;\">Edição limitada · 3/10<\u002Fdiv>\n          <\u002Fdiv>\n          <span style=\"font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: #A9814A;\">Sob consulta<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 5. PROCESSO ARTÍSTICO ============ -->\n  <section style=\"background: #1B1814; padding: 160px 96px; color: #F5F1EA;\">\n    <div style=\"max-width: 1440px; margin: 0 auto; display: grid; grid-template-columns: 1fr 0.85fr; gap: 88px; align-items: center;\">\n      <div>\n        <div style=\"font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: #E9C98A; font-weight: 600; margin-bottom: 20px;\">Processo artístico<\u002Fdiv>\n        <h2 style=\"font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 38px; margin: 0 0 28px; max-width: 480px;\">Dias de permanência antes de um único clique.<\u002Fh2>\n        <p style=\"font-size: 16px; line-height: 1.8; color: #D8D0C0; margin: 0 0 36px; max-width: 480px;\">Cada série nasce de uma imersão prolongada — às vezes semanas — no lugar retratado. A câmera só aparece quando a presença da artista deixou de alterar a cena.<\u002Fp>\n        <a href=\"A Artista.dc.html\" style=\"text-decoration: underline; text-underline-offset: 4px; font-size: 15px; color: #F5F1EA;\">Conhecer o processo completo →<\u002Fa>\n      <\u002Fdiv>\n      <image-slot id=\"processo-hero\" shape=\"rect\" placeholder=\"Bastidor: artista em campo\" style=\"width: 100%; aspect-ratio: 4/5; display: block;\"><\u002Fimage-slot>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 6. SOBRE A ARTISTA ============ -->\n  <section style=\"max-width: 1440px; margin: 0 auto; padding: 160px 96px; display: grid; grid-template-columns: 0.85fr 1fr; gap: 88px; align-items: center;\">\n    <image-slot id=\"artist-portrait\" shape=\"rect\" placeholder=\"Retrato da fotógrafa\" style=\"width: 100%; aspect-ratio: 4/5; display: block;\"><\u002Fimage-slot>\n    <div>\n      <div style=\"font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: #A9814A; font-weight: 600; margin-bottom: 20px;\">A artista<\u002Fdiv>\n      <h2 style=\"font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 38px; margin: 0 0 28px; max-width: 480px;\">Bocairú observa antes de fotografar.<\u002Fh2>\n      <p style=\"font-size: 17px; line-height: 1.8; color: #3A342C; max-width: 480px; margin: 0 0 20px;\">Cada série nasce de uma permanência prolongada no lugar retratado — o gesto, a luz e o silêncio importam mais que o instante decisivo.<\u002Fp>\n      <a href=\"A Artista.dc.html\" style=\"text-decoration: underline; text-underline-offset: 4px; font-size: 15px; color: #1B1814;\">Conhecer a história completa →<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 7. DEPOIMENTOS ============ -->\n  <section style=\"background: #EDE6D8; padding: 140px 96px;\">\n    <div style=\"max-width: 1440px; margin: 0 auto;\">\n      <div style=\"display: flex; align-items: center; gap: 16px; margin-bottom: 72px;\">\n        <div style=\"width: 40px; height: 1px; background: #A9814A;\"><\u002Fdiv>\n        <div style=\"font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: #6B6459;\">Certificado de autenticidade assinado à mão em toda edição limitada<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 72px;\">\n        <div style=\"border-left: 2px solid #A9814A; padding-left: 32px;\">\n          <p style=\"font-family: 'Instrument Serif', serif; font-style: italic; font-size: 23px; color: #1B1814; margin: 0 0 20px; line-height: 1.5;\">\"A obra transformou a sala. Cada visita vira uma conversa sobre a fotografia e sobre o Brasil que ela retrata.\"<\u002Fp>\n          <div style=\"font-size: 13px; color: #6B6459;\">— Fabiana R., colecionadora<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border-left: 2px solid #A9814A; padding-left: 32px;\">\n          <p style=\"font-family: 'Instrument Serif', serif; font-style: italic; font-size: 23px; color: #1B1814; margin: 0 0 20px; line-height: 1.5;\">\"Acompanhei todo o processo até a assinatura do certificado — atenção rara ao detalhe.\"<\u002Fp>\n          <div style=\"font-size: 13px; color: #6B6459;\">— Marcelo T., colecionador<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 8. CTA FINAL ============ -->\n  <section id=\"cta-final\" style=\"background: #1B1814; color: #F5F1EA; padding: 120px 96px;\">\n    <div style=\"max-width: 1440px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 48px; flex-wrap: wrap;\">\n      <div style=\"max-width: 460px;\">\n        <h2 style=\"font-family: 'Instrument Serif', serif; font-weight: 400; font-style: italic; font-size: 36px; margin: 0 0 16px;\">Uma obra sob medida para o seu espaço.<\u002Fh2>\n        <p style=\"font-size: 15px; color: #B8AF9E; margin: 0;\">Encomendas exclusivas e consultoria para projetos residenciais e corporativos.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display: flex; gap: 12px; flex: 1; min-width: 320px; max-width: 480px;\">\n        <input type=\"email\" placeholder=\"Seu e-mail\" style=\"flex: 1; background: transparent; border: none; border-bottom: 1px solid rgba(245,241,234,0.4); color: #F5F1EA; font-family: 'Work Sans', sans-serif; font-size: 15px; padding: 12px 4px; outline: none; transition: border-color 250ms ease;\">\n        <button style=\"background: #F5F1EA; color: #1B1814; border: none; padding: 0 28px; font-size: 14px; letter-spacing: 0.03em; border-radius: 2px; cursor: pointer; transition: background 250ms ease, transform 150ms ease;\" style-hover=\"background:#E9C98A;\" style-active=\"transform:scale(0.97);\">Solicitar encomenda<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ FOOTER ============ -->\n  <footer style=\"background: #1B1814; color: #B8AF9E; padding: 72px 96px 40px; border-top: 1px solid rgba(245,241,234,0.12);\">\n    <div style=\"max-width: 1440px; margin: 0 auto; display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 48px; padding-bottom: 40px;\">\n      <div>\n        <div style=\"font-family: 'Instrument Serif', serif; font-style: italic; font-size: 24px; color: #F5F1EA; margin-bottom: 12px;\">BOCAIRÚ<\u002Fdiv>\n        <p style=\"font-size: 14px; max-width: 320px; margin: 0;\">Fotografia fine art e obras exclusivas, produzidas em processos de padrão museológico.<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #6B6459; margin-bottom: 16px;\">Navegação<\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 10px; font-size: 14px;\">\n          <a href=\"Galeria.dc.html\" style=\"color: #B8AF9E; text-decoration: none;\">Galeria<\u002Fa>\n          <a href=\"Colecoes.dc.html\" style=\"color: #B8AF9E; text-decoration: none;\">Coleções<\u002Fa>\n          <a href=\"A Artista.dc.html\" style=\"color: #B8AF9E; text-decoration: none;\">A Artista<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #6B6459; margin-bottom: 16px;\">Contato<\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 10px; font-size: 14px;\">\n          <a href=\"#\" style=\"color: #B8AF9E; text-decoration: none;\">contato@bocairu.com<\u002Fa>\n          <a href=\"#\" style=\"color: #B8AF9E; text-decoration: none;\">@bocairu<\u002Fa>\n          <a href=\"Encomendas e Consultoria.dc.html\" style=\"color: #B8AF9E; text-decoration: none;\">Encomendas &amp; Consultoria<\u002Fa>\n          <a href=\"Admin.dc.html\" style=\"color: #6B6459; text-decoration: none; font-size: 12px; margin-top: 6px;\" style-hover=\"color:#B8AF9E;\">Painel administrativo<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"max-width: 1440px; margin: 0 auto; border-top: 1px solid rgba(245,241,234,0.12); padding-top: 24px; font-size: 12px; color: #6B6459;\">© 2026 Bocairú. Todos os direitos reservados.<\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { scrolled: false, isLoggedIn: false };\n\n  componentDidMount() {\n    this._onScroll = () => {\n      const isScrolled = window.scrollY > 40;\n      if (isScrolled !== this.state.scrolled) this.setState({ scrolled: isScrolled });\n    };\n    window.addEventListener('scroll', this._onScroll, { passive: true });\n    this.setState({ isLoggedIn: window.localStorage.getItem('bocairu_auth') === '1' });\n  }\n\n  componentWillUnmount() {\n    window.removeEventListener('scroll', this._onScroll);\n  }\n\n  renderVals() {\n    const scrolled = this.state.scrolled;\n    return {\n      headerPaddingV: scrolled ? '14px' : '28px',\n      headerBg: scrolled ? 'rgba(245,241,234,0.96)' : 'transparent',\n      headerBorder: scrolled ? '#DCD4C4' : 'transparent',\n      headerText: scrolled ? '#1B1814' : '#F5F1EA',\n      accountHref: this.state.isLoggedIn ? 'Minha Conta.dc.html' : 'Autenticacao.dc.html?redirect=account'\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
